name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          swift --version
      - name: Build
        run: Scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Parvus-dmg
          path: dist/Parvus.dmg
